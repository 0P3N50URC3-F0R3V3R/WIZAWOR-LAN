<!DOCTYPE html>
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	
	<link rel="shortcut icon" href="favicon.ico">
	<meta name="robots" content="noindex,nofollow">
	<title>Unsupported browser</title>

	<style type="text/css">
		@font-face {
			font-family: 'WizardOfWor';
			src: url('fonts/v2.0/wizardofwor-webfont.woff') format('woff');
			font-weight: normal;
			font-style: normal;
		}
		html,
		body {
			position: relative;
			margin: 2vh 0px 0px 0px;
			padding: 0px;
			height: 100%;
			min-height: 100%;
			background: #191d19;
			overflow: hidden;
			font-family: 'WizardOfWor';
			text-align: center;
		}
		p {
			line-height: 1.2;
			font-size: 30px;
			color: #fbfb8b;
			text-transform: uppercase;
		}
		a {
			padding: 2px;
			color: #191d19;
			background: #fbfb8b;
			text-decoration: none;
			cursor: pointer;
		}
	</style>
</head>
<body>
	<img src="images/v2.0/wizard-of-wor-icon.png">
	<p>
		Unsupported browser<br>
		<br>
		Please upgrade your browser<br>
		to latest version of
		<a href="https://www.google.com/chrome/" target="download">Chrome</a>
		or <a href="https://www.mozilla.org/firefox/" target="download">FireFox</a>!
	</p>


</body></html>
